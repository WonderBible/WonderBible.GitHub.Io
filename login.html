<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - WonderBible</title>
      <link rel="icon" href="WB Logo.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: 'Gabarito', Arial, sans-serif; background: linear-gradient(120deg, #ffa500 0%, #5d00ff 100%); }
    .login-container {
      max-width: 400px; margin: 60px auto; background: #fff; border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 32px 24px; text-align: center;
    }
    .login-container h2 { margin-bottom: 24px; color: #009cff; }
    .login-container input {
      width: 90%; padding: 10px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;
    }
    .login-container button {
      background: #ffb84d; color: #2e1a8e; font-weight: bold; border: none; border-radius: 8px; padding: 12px 32px; cursor: pointer; margin-top: 18px;
    }
    .login-container button:hover { background: #ffd580; }
    .login-container .msg { margin-top: 16px; font-weight: bold; }
    .login-container a { color: #009cff; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-container">
            <a href="https://wonderbible.github.io" style="color: aqua; text-decoration: none;">Home</a><br><hr>
    <img src="WB Logo.png" width="70" style="margin-top: 20px;" alt="WonderBible Logo" class="register-logo">
    <h2>Login</h2>
        <div style="margin-bottom: 30px;" class="register-subtitle">Login to your Existing <strong style="color: #ffa500;">W</strong>onder<strong style="color: #5d00ff;">B</strong>ible account</div>
    <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" required>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
    <button onclick="loginUser()">Login</button>
    <div class="msg" id="loginMsg"></div>
    <div style="margin:18px 0;">
      <div id="gSignInBtn"></div>
    </div>
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    function loginUser() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const msg = document.getElementById('loginMsg');
      let accounts = [];
      try { accounts = JSON.parse(localStorage.getItem('wb_accounts') || '[]'); } catch { accounts = []; }
      const user = accounts.find(acc => acc.username === username && acc.password === password);
      if (!username || !password) {
        msg.textContent = "Please enter username and password.";
        msg.style.color = "#d32f2f";
        return;
      }
      if (user) {
        msg.textContent = "Login successful! Redirecting...";
        msg.style.color = "#009cff";
        localStorage.setItem('wb_logged_in', '1');
        localStorage.setItem('wb_user_firstname', user.firstName || '');
        localStorage.setItem('wb_user_username', user.username);
        localStorage.setItem('wb_user_password', user.password);
        localStorage.setItem('wb_user_pic', user.pic || 'user.png');
        setTimeout(() => window.location = "index.html", 1200);
      } else {
        msg.textContent = "Invalid username or password.";
        msg.style.color = "#d32f2f";
      }
    }
    // Google Sign-In logic
    window.onload = function() {
      google.accounts.id.initialize({
        client_id: '874109905589-1306trr1l0np3nijbio3el9mc4fmuppi.apps.googleusercontent.com',
        callback: handleGoogleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById("gSignInBtn"),
        { theme: "outline", size: "large", text: "continue_with", shape: "pill" }
      );
    };
    function handleGoogleCredentialResponse(response) {
      // Decode JWT
      const payload = JSON.parse(atob(response.credential.split('.')[1]));
      const email = payload.email;
      const firstName = payload.given_name || '';
      const pic = payload.picture || 'user.png';
      let accounts = [];
      try { accounts = JSON.parse(localStorage.getItem('wb_accounts') || '[]'); } catch { accounts = []; }
      let user = accounts.find(acc => acc.username === localStorage.getItem('wb_user_username'));
      if (user) {
        // Already registered, log in with username and password
        localStorage.setItem('wb_logged_in', '1');
        localStorage.setItem('wb_user_firstname', user.firstName);
        localStorage.setItem('wb_user_username', user.username);
        localStorage.setItem('wb_user_password', user.password);
        localStorage.setItem('wb_user_pic', user.pic);
        document.getElementById('loginMsg').textContent = "Signed in with Google! Redirecting...";
        document.getElementById('loginMsg').style.color = "#009cff";
        setTimeout(() => window.location = "index.html", 1200);
      } else {
        // New Google user: ask for username and password
        let username = prompt("Choose a username for your WonderBible account:");
        if (!username) {
          document.getElementById('loginMsg').textContent = "Username is required for Google registration.";
          document.getElementById('loginMsg').style.color = "#d32f2f";
          return;
        }
        username = username.trim();
        if (!/^[a-zA-Z0-9._]+$/.test(username)) {
          alert("Username can only contain letters, numbers, full stop (.) and underscore (_).");
          return;
        }
        if (accounts.some(acc => acc.username === username)) {
          alert("Username already taken. Please choose another.");
          return;
        }
        let password = prompt("Choose a password for your WonderBible account (min 6 characters):");
        if (!password || password.length < 6) {
          alert("Password must be at least 6 characters.");
          return;
        }
        accounts.push({ firstName, username, password, pic });
        localStorage.setItem('wb_accounts', JSON.stringify(accounts));
        localStorage.setItem('wb_logged_in', '1');
        localStorage.setItem('wb_user_firstname', firstName);
        localStorage.setItem('wb_user_username', username);
        localStorage.setItem('wb_user_password', password);
        localStorage.setItem('wb_user_pic', pic);
        document.getElementById('loginMsg').textContent = "Google registration complete! Redirecting...";
        document.getElementById('loginMsg').style.color = "#009cff";
        setTimeout(() => window.location = "index.html", 1200);
      }
    }
  </script>
</body>

    }
  </script>
</body>
</html>
